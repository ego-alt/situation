# Runs on every push to main and on pull requests. The Pi's deploy timer
# (dashboard/scripts/deploy.sh) only ships commits whose CI passed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"   # matches the Dockerfile's base image
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Tests
        run: uv run pytest -q
      - name: Lint
        run: uvx ruff@0.9.7 check . --output-format github

  # The Pi runs this image instead of building it (dashboard/scripts/deploy.sh
  # pulls the one tagged with the commit whose CI passed). Only for pushes to
  # main, never pull requests, and only once the checks above pass.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
