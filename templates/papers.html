<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070a0b">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.svg') }}">
    <title>Situation · Papers</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts/inter.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts/plexmono.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/controls.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/situation.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/papers.css') }}">
    <script>window.APP_ROOT = {{ request.script_root|tojson }};</script>
    {% set tab = 'papers' %}{% include '_last_tab.html' %}
</head>
<body class="papers-page">
    <header class="bar">
        <div class="brand"><span class="brand-name">SITUATION</span>{% include '_tabs.html' %}</div>
        <!-- One status, as on News: how fresh the papers are; amber when a journal couldn't be read. -->
        <span class="status" id="paperStatus"><span class="status-dot" aria-hidden="true"></span><span id="updated">—</span></span>
    </header>

    <main class="press">
        <header class="masthead">
            <h1 class="nameplate">{{ subject }}</h1>
            <div class="folio">
                <button type="button" class="btn btn-ghost folio-step" id="prevEdition" data-dir="prev" disabled><span aria-hidden="true">‹</span> <span class="folio-step-label"></span></button>
                <p class="folio-line" id="folio" aria-live="polite">&nbsp;</p>
                <button type="button" class="btn btn-ghost folio-step" id="nextEdition" data-dir="next" disabled><span class="folio-step-label"></span> <span aria-hidden="true">›</span></button>
            </div>
        </header>
        <div id="notice" class="notice" role="status" hidden></div>
        <div id="edition" class="edition"><p class="press-empty">Loading…</p></div>
        <nav class="turn" id="turn" aria-label="Editions" hidden>
            <button type="button" class="btn btn-ghost folio-step" data-dir="prev" disabled><span aria-hidden="true">‹</span> <span class="folio-step-label"></span></button>
            <button type="button" class="btn btn-ghost folio-step" data-dir="next" disabled><span class="folio-step-label"></span> <span aria-hidden="true">›</span></button>
        </nav>
        <footer class="press-foot" id="foot"></footer>
    </main>

    <dialog class="viewer" id="viewer" aria-labelledby="viewerTitle">
        <div class="viewer-bar">
            <p class="viewer-title" id="viewerTitle"></p>
            <button type="button" class="btn viewer-close" id="viewerClose">Close</button>
        </div>
        <div class="viewer-stage" id="viewerStage"><img id="viewerImg" alt="" referrerpolicy="no-referrer"></div>
        <p class="viewer-hint">Tap to zoom in or out</p>
    </dialog>

    <script src="{{ url_for('static', filename='js/signed_out.js') }}"></script>
    <script src="{{ url_for('static', filename='js/papers.js') }}"></script>
</body>
</html>
