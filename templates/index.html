<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070a0b">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.svg') }}">
    <title>Situation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts/inter.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts/plexmono.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/controls.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/situation.css') }}">
    <script>window.APP_ROOT = {{ request.script_root|tojson }};</script>
    {% set tab = 'news' %}{% include '_last_tab.html' %}
</head>
<body>
    <header class="bar">
        <div class="brand"><span class="brand-name">SITUATION</span>{% include '_tabs.html' %}</div>
        <!-- One status: how fresh the news is (tap to fetch now); amber when something's wrong, with what in its title. -->
        <button type="button" class="btn btn-ghost status" id="syncButton" title="Fetch the news now">
            <span class="status-dot" aria-hidden="true"></span><span id="sync">—</span>
        </button>
    </header>

    <main class="board">
        <section class="theatre" aria-label="World map">
            <svg id="map" class="map" role="img" aria-label="Where today's stories are"></svg>
            <div class="zoom" role="group" aria-label="Map zoom">
                <button type="button" class="btn btn-float" data-zoom="in" aria-label="Zoom in">+</button>
                <button type="button" class="btn btn-float" data-zoom="out" aria-label="Zoom out">−</button>
                <button type="button" class="btn btn-float zoom-world" data-zoom="world">World</button>
            </div>
            <div class="legend" aria-hidden="true">
                <span><i class="dot flash"></i>flash</span>
                <span><i class="dot priority"></i>priority</span>
                <span><i class="dot signal"></i>signal</span>
            </div>
            <div class="scanline" aria-hidden="true"></div>
        </section>

        <aside class="intel" aria-label="Today's stories">
            <div id="notice" class="notice" role="status" hidden></div>
            <div id="feed" aria-live="polite"><div class="empty">Acquiring…</div></div>
            <p class="credit">Map: <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a>.
                Places: <a href="https://www.geonames.org/" target="_blank" rel="noopener">GeoNames</a> (CC BY 4.0).
                · <a href="{{ url_for('label_page') }}">Label stories</a> to tune the ranking.</p>
        </aside>
    </main>

    <script src="{{ url_for('static', filename='js/signed_out.js') }}"></script>
    <script src="{{ url_for('static', filename='js/situation.js') }}"></script>
</body>
</html>
