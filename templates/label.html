<!DOCTYPE html>
<html lang="en">
<head>
    {% include '_head.html' %}
    <title>Situation · Label</title>
    <script src="{{ url_for('static', filename='js/label.js') }}" defer></script>
</head>
<body class="label-page">
    <header class="bar">
        <a class="brand" href="{{ url_for('index') }}">SITUATION<span class="brand-sub">label</span></a>
        <div class="readouts">
            <span class="readout"><span class="k">TODAY</span> <span id="countToday">—</span></span>
            <span class="readout"><span class="k">TOTAL</span> <span id="countTotal">—</span></span>
        </div>
    </header>
    <main class="label-main">
        <p class="label-intro">Mostly the question only you can answer: what matters. Go with your first instinct.</p>
        <div id="question" aria-live="polite"></div>
    </main>
    <!-- The first question and the counts, as /api/label gives them. -->
    <script id="label" type="application/json">{{ label|tojson }}</script>
</body>
</html>
